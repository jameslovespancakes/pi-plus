name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

jobs:
  verify:
    name: Lint / Typecheck / Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm install --no-audit --no-fund

      # Lint first: it is the fastest gate and catches dead code that the
      # typechecker accepts.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify package contents
        run: |
          npm pack --dry-run
          # Fail loudly if a real credential ever reaches the tarball.
          if npm pack --dry-run --json \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const f=JSON.parse(d)[0].files.map(x=>x.path);const bad=f.filter(p=>/^config\/(pi-plus|pi-plus\.env|agent-board|model-quality-key)\.json$/.test(p));if(bad.length){console.error('Secret file staged for publish:',bad.join(', '));process.exit(1)}})"; then
            echo "No credential files in tarball."
          else
            exit 1
          fi
