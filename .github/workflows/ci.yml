name: CI

on:
  pull_request:
  push:
  workflow_call:

jobs:
  verify:
    name: Lint, Type Check, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v5

      - name: Set Up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Run Tests
        run: npm test

      - name: Verify Package Contents
        run: |
          npm pack --dry-run
          if npm pack --dry-run --json \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const f=JSON.parse(d)[0].files.map(x=>x.path);const bad=f.filter(p=>/^config\/(pi-plus|pi-plus\.env|agent-board|model-quality-key)\.json$/.test(p));if(bad.length){console.error('Secret file staged for publish:',bad.join(', '));process.exit(1)}})"; then
            echo "No credential files in tarball."
          else
            exit 1
          fi
