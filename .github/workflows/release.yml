name: Release

# Every push to main that passes lint, typecheck and tests is bumped and
# published. Skip a release by putting [skip release] in the commit message.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # Lets the runner mint an OIDC token for npm trusted publishing. The npm CLI
  # detects this automatically and prefers it over NPM_TOKEN, so the secret
  # becomes unnecessary once a trusted publisher is configured.
  id-token: write

jobs:
  # Gate. Reuses the CI workflow verbatim so "verified" means exactly the same
  # thing on a pull request as it does on a release, and cannot drift.
  verify:
    # Deliberately unnamed: GitHub prefixes the reusable workflow's own job
    # name with this one, and naming both renders it twice.
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    # Structural gate, not just step ordering: this job cannot start unless
    # every check above succeeded.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Node 24 ships npm 11.19; trusted publishing needs npm >= 11.5.1 and
      # Node >= 22.14, and Node 22 only ships npm 10.9.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Bump version
        id: bump
        run: node scripts/bump-version.mjs

      - name: Abort if the version already exists on npm
        run: |
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@${{ steps.bump.outputs.to }}" version >/dev/null 2>&1; then
            echo "::error::Version ${{ steps.bump.outputs.to }} is already published."
            exit 1
          fi

      # Authentication resolves in this order:
      #   1. OIDC, once a trusted publisher is configured for this package on
      #      npmjs.com. Nothing stored and nothing to expire.
      #   2. NPM_TOKEN, needed only for the first publish, because a trusted
      #      publisher can only be attached to a package that already exists.
      #
      # A granular token must have "Bypass 2FA" enabled, or npm answers 403
      # even when the token is otherwise valid.
      - name: Publish to npm
        id: publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Explain a 403
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          {
            echo "### Publish failed"
            echo
            echo "If the log shows \`403 ... bypass 2fa\`, the NPM_TOKEN lacks the"
            echo "**Bypass 2FA** capability. npm requires it for automated publishing."
            echo
            echo "Fix either way:"
            echo "- Recreate the granular token with **Bypass 2FA** enabled, or"
            echo "- Publish once locally with \`npm publish --access public --otp=<code>\`,"
            echo "  then configure a **trusted publisher** so no token is needed again."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Release v${{ steps.bump.outputs.to }} [skip release]"
          # Annotated, not lightweight: `--follow-tags` pushes only annotated
          # tags, so a lightweight one silently never reaches the remote.
          git tag -a "v${{ steps.bump.outputs.to }}" -m "Release v${{ steps.bump.outputs.to }}"
          git push origin main --follow-tags

      - name: Summary
        run: |
          {
            echo "### Released \`${{ steps.bump.outputs.from }}\` → \`${{ steps.bump.outputs.to }}\`"
            echo
            echo "\`\`\`sh"
            echo "pi install npm:$(node -p "require('./package.json').name")"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
