name: Release

# Publishing requires an explicit --release marker or manual confirmation.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Type --release to confirm
        required: true
        default: ""
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  verify:
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '--release'))
      || (github.event_name == 'workflow_dispatch' && inputs.release == '--release')
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Full History
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Calculate Version
        id: bump
        run: node scripts/bump-version.mjs

      - name: Promote Changelog
        run: |
          if ! node scripts/changelog.mjs --promote "${{ steps.bump.outputs.to }}" > /tmp/notes.md; then
            echo "::error::Add release notes under ## [Unreleased] in CHANGELOG.md."
            exit 1
          fi

      - name: Collect Changes Since Last Release
        id: changes
        shell: bash
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            git log --pretty='- %s (`%h`)' "$PREVIOUS_TAG..HEAD" > /tmp/changes.md
          else
            git log --pretty='- %s (`%h`)' HEAD > /tmp/changes.md
          fi
          [[ -s /tmp/changes.md ]] || echo "- Release metadata only" > /tmp/changes.md

      - name: Check NPM Version
        run: |
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@${{ steps.bump.outputs.to }}" version >/dev/null 2>&1; then
            echo "::error::Version ${{ steps.bump.outputs.to }} already exists on NPM."
            exit 1
          fi

      - name: Publish to NPM
        id: npm_publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Explain NPM Authentication Failure
        if: failure() && steps.npm_publish.outcome == 'failure'
        run: |
          {
            echo "### NPM publish failed"
            echo
            echo "Use trusted publishing, or give NPM_TOKEN permission to bypass 2FA."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mirror to GitHub Packages
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NPMRC="$(mktemp)"
          trap 'rm -f "$NPMRC"' EXIT
          {
            echo "@jameslovespancakes:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } > "$NPMRC"
          NPM_CONFIG_USERCONFIG="$NPMRC" npm publish \
            --registry=https://npm.pkg.github.com \
            --access public

      - name: Commit Release Metadata
        run: |
          VERSION="${{ steps.bump.outputs.to }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "Release v$VERSION [skip release]"
          git tag -a "v$VERSION" -m "Release v$VERSION"

      - name: Push Release Difference
        run: |
          VERSION="${{ steps.bump.outputs.to }}"
          git push origin HEAD:main
          git push origin "v$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="${{ steps.bump.outputs.to }}"
          PREVIOUS_TAG="${{ steps.changes.outputs.previous_tag }}"
          {
            cat /tmp/notes.md
            echo
            echo "## Changes Since ${PREVIOUS_TAG:-Repository Start}"
            echo
            cat /tmp/changes.md
            echo
            echo '```sh'
            echo "pi install npm:$NAME"
            echo '```'
            echo
            echo "[View on NPM](https://www.npmjs.com/package/$NAME/v/$VERSION)"
          } > /tmp/release-body.md
          gh release create "v$VERSION" \
            --repo "${{ github.repository }}" \
            --title "v$VERSION" \
            --notes-file /tmp/release-body.md

      - name: Write Summary
        run: |
          {
            echo "### Released \`${{ steps.bump.outputs.from }}\` → \`${{ steps.bump.outputs.to }}\`"
            echo
            cat /tmp/changes.md
          } >> "$GITHUB_STEP_SUMMARY"
